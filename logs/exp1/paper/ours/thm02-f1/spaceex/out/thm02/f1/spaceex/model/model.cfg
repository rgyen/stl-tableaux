system = "system"
initially = "x0 <= 22 & 18 <= x0 & clk0 == 0.0 & x1 <= 22 & gClk == 0.0 & clk1 == 0.0 & 18 <= x1 & (loc(subsystem) == mode_id_8)"
forbidden = "loc(subsystem) == mode_id_10 || loc(subsystem) == mode_id_13 || loc(subsystem) == mode_id_22"
scenario = "stc"
directions = "oct"
set-aggregation = chull
flowpipe-tolerance = 1
flowpipe-tolerance-rel = 0
time-horizon = 7
iter-max = -1
output-variables = "clk0, clk0"
output-format = "INTV"