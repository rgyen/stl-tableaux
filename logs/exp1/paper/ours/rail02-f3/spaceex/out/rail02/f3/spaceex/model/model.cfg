system = "system"
initially = "clk2 == 0.0 & clk0 == 0.0 & pb <= 0.5 & gClk == 0.0 & vb == 0 & clk1 == 0.0 & 89 <= x & 0 <= pb & x <= 90 & (loc(subsystem) == mode_id_11)"
forbidden = "loc(subsystem) == mode_id_1 || loc(subsystem) == mode_id_2 || loc(subsystem) == mode_id_4 || loc(subsystem) == mode_id_7"
scenario = "stc"
directions = "oct"
set-aggregation = chull
flowpipe-tolerance = 1
flowpipe-tolerance-rel = 0
time-horizon = 3
iter-max = -1
output-variables = "pb, pb"
output-format = "INTV"