system = "system"
initially = "8 <= g1 & clk0 == 0.0 & g1 <= 8.5 & gClk == 0.0 & clk1 == 0.0 & d1 <= 0.1 & 0 <= d1 & (loc(subsystem) == mode_id_1)"
forbidden = "loc(subsystem) == mode_id_0 || loc(subsystem) == mode_id_5 || loc(subsystem) == mode_id_13"
scenario = "stc"
directions = "oct"
set-aggregation = chull
flowpipe-tolerance = 1
flowpipe-tolerance-rel = 0
time-horizon = 3
iter-max = -1
output-variables = "clk0, clk0"
output-format = "INTV"