system = "system"
initially = "clk2 == 0.0 & clk0 == 0.0 & 4.4 <= x1 & gClk == 0.0 & 5.9 <= x2 & clk1 == 0.0 & x2 <= 6 & x1 <= 4.5 & (loc(subsystem) == mode_id_5)"
forbidden = "loc(subsystem) == mode_id_0 || loc(subsystem) == mode_id_2 || loc(subsystem) == mode_id_12 || loc(subsystem) == mode_id_16"
scenario = "stc"
directions = "oct"
set-aggregation = chull
flowpipe-tolerance = 1
flowpipe-tolerance-rel = 0
time-horizon = 10
iter-max = -1
output-variables = "clk0, clk0"
output-format = "INTV"