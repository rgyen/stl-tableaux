system = "system"
initially = "y <= 70 & y >= 60 & vy >= -1 & clk0 == 0.0 & x >= 60 & gClk == 0.0 & x <= 70 & clk1 == 0.0 & vx >= -1 & vy <= 0 & vx <= 0 & (loc(subsystem) == mode_id_11)"
forbidden = "loc(subsystem) == mode_id_2 || loc(subsystem) == mode_id_8 || loc(subsystem) == mode_id_13"
scenario = "stc"
directions = "oct"
set-aggregation = chull
flowpipe-tolerance = 1
flowpipe-tolerance-rel = 0
time-horizon = 3
iter-max = -1
output-variables = "clk0, clk0"
output-format = "INTV"