# Defaults shared by Exp1 and Exp2; benchmark cfg files override these values.

common {
    threshold = 0.01
    time-horizon = "time-bound"
    goal = "all"
    dump = "false"
}

flowstar {
    ode-type = "poly-ode-2"
    ode-order = 8
    max-jumps = 1000
    min-step = 0.001
    max-step = 0.5
    executable-path = "../../.tools/flowstar/flowstar"
}

spaceex {
    executable-path = "../../.tools/spaceex/spaceex_exe/spaceex"
    iter-max = -1
    scenario = "stc"
}

dreach {
    converter-path = "../../.tools/hyst" # hyst executable path
    executable-path = "../../.tools/dreal/dReach"
}

sat-reach {
    executable-path = "../../.tools/sat-reach/sat-reach"
    converter-path = "../../.tools/sat-reach/Model-Translator.jar"
}
